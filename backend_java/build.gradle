plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// Postgres SQL
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'

	//Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'


	// MQTT
	implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
	implementation "org.springframework.integration:spring-integration-mqtt:7.1.1"

	//Google Calender
	implementation 'com.google.apis:google-api-services-calendar:v3-rev20260708-2.0.0'
    implementation 'com.google.api-client:google-api-client:2.9.1'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.39.0'

	testImplementation 'org.mockito:mockito-core:5.19.0'
	testImplementation 'org.mockito:mockito-junit-jupiter:5.19.0'


}

tasks.named('test') {
	useJUnitPlatform()
	
	testLogging {
        showStandardStreams = true
    }
}
