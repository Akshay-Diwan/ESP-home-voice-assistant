spring:
  application:
    name: java_backend

  datasource:
    url: ${POSGRES_URI}
    username: ${PG_USERNAME}
    password: ${PG_PASS}

  jpa:
    hibernate:
      ddl-auto: create

    # show-sql: true  
    properties:
      hibernate:
        format_sql: true

mqtt:
  url: "tcp://localhost:1883"
  username: "user1"
  password: "akshay"
  default:
    client:
      id: "spring"

calendar:
  google:
    application-name: ESP Assistant Calendar Tool
    credentials-file: classpath:credentials.json
    calendar-id: ${CALENDAR_ID}
    timezone: Asia/Kolkata

notion:
    token: ${NOTION_TOKEN}
    version: "2022-06-28"
    page-id: 3db54d38bea18014b882e5de2298bbd5
    data-source-id: 3dc54d38bea1809ab9acd3761fe06cf7

discord:
  bot:
    token: ${DISCORD_BOT_TOKEN}
    auto-close-minutes: 5
    history-page-size: 100


  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:3b
        options:
          temperature: 0.2
    mcp:

      server:
        streamable-http:
          enabled: true
          mcp-endpoint: /mcp
          disallow-unconfigured-clients: false
      client:
        enabled: true
        name: local-assistant
        version: 1.0.0
        type: SYNC
        transport: IN_PROCESS
logging:
  level:
    org:
      hibernate: 
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE
    org.springframework.web: DEBUG
    org.springframework.ai.mcp: DEBUG
